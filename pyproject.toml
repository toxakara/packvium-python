[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "packvium"
version = "1.3.0"
description = "Deterministic, extensible 3D cartonization and rectangular bin-packing library"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "Packvium contributors"}]
keywords = ["3d-bin-packing", "cartonization", "packaging", "container-loading"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Libraries",
  "Topic :: Office/Business",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://packvium.com"
Source = "https://github.com/toxakara/packvium-python"
Documentation = "https://packvium.com/docs"
Changelog = "https://github.com/toxakara/packvium-python/blob/main/CHANGELOG.md"
Issues = "https://github.com/toxakara/packvium-python/issues"

[project.scripts]
packvium = "packvium.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
